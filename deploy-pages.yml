name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the static site (exclude backend source and internal-only files)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='functions' --exclude='scripts' --exclude='node_modules' \
            --exclude='tsipracticeprep-full-site' \
            --exclude='README.md' --exclude='BACKEND-SETUP.md' \
            --exclude='FIREBASE-SETUP.md' --exclude='LAUNCH-CHECKLIST.md' \
            --exclude='QUESTION-BANK-QUALITY.md' --exclude='_redirects' \
            --exclude='firestore.rules' --exclude='database.rules.json' \
            --exclude='ads.txt.template' --exclude='seo-update.zip' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
